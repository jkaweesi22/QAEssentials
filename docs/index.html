<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAEssentials</title>
    <meta
      name="description"
      content="QAEssentials QA documentation site"
    />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cpath%20fill='%233a63f1'%20d='M32%204l20%2010v18c0%2016-10%2030-20%2032C22%2062%2012%2048%2012%2032V14L32%204z'/%3E%3Cpath%20fill='none'%20stroke='%23ffffff'%20stroke-width='6'%20stroke-linecap='round'%20stroke-linejoin='round'%20d='M20%2033l8%208%2016-20'/%3E%3C/svg%3E" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        <div class="site-title">QAEssentials</div>
        <div class="site-tagline">Practical QA documentation</div>
      </div>
      <nav class="site-links" aria-label="Quick links">
        <a class="site-link" href="qualityfirst/index.html">Quality First Culture</a>
      </nav>
    </header>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "QAEssentials",
        basePath: "./",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2,
        plugins: [
          function (hook) {
            hook.afterEach(function (html) {
              return (
                html +
                "\n\n<footer class=\"site-footer\">&copy; 2026 Jackie Namanda. <a href=\"https://www.linkedin.com/in/jackie-namanda-75912a81/\" target=\"_blank\" rel=\"noopener\">LinkedIn</a></footer>"
              );
            });
          }
        ]
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script>
      (function () {
        const storageKey = "qaessentials-theme";
        const root = document.documentElement;

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);
          try {
            localStorage.setItem(storageKey, theme);
          } catch (error) {
            // Ignore storage errors
          }
        }

        function getInitialTheme() {
          try {
            const stored = localStorage.getItem(storageKey);
            if (stored === "light" || stored === "dark") return stored;
          } catch (error) {
            // Ignore storage errors
          }
          return "light";
        }

        function addToggle() {
          if (document.querySelector(".theme-toggle")) return true;

          const button = document.createElement("button");
          button.className = "theme-toggle";
          button.type = "button";
          button.setAttribute("aria-label", "Toggle theme");
          button.textContent = "Dark mode";
          button.addEventListener("click", () => {
            const next =
              root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(next);
            button.textContent = next === "dark" ? "Light mode" : "Dark mode";
          });

          document.body.appendChild(button);
          return true;
        }

        const initialTheme = getInitialTheme();
        applyTheme(initialTheme);

        addToggle();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAEssentials</title>
    <meta
      name="description"
      content="QAEssentials QA documentation site"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title">QAEssentials</div>
      <div class="site-tagline">Practical QA documentation</div>
    </header>
    <div id="app"></div>
    <footer class="site-footer">
      QAEssentials · Built for practical QA learning
    </footer>
    <script>
      window.$docsify = {
        name: "QAEssentials",
        basePath: "./",
        homepage: "README.md",
        loadSidebar: true,
        subMaxLevel: 2
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script>
      (function () {
        const storageKey = "qaessentials-theme";
        const root = document.documentElement;

        function applyTheme(theme) {
          root.setAttribute("data-theme", theme);
          try {
            localStorage.setItem(storageKey, theme);
          } catch (error) {
            // Ignore storage errors
          }
        }

        function getInitialTheme() {
          try {
            const stored = localStorage.getItem(storageKey);
            if (stored === "light" || stored === "dark") return stored;
          } catch (error) {
            // Ignore storage errors
          }
          return "light";
        }

        function addToggle() {
          if (document.querySelector(".theme-toggle")) return true;

          const button = document.createElement("button");
          button.className = "theme-toggle";
          button.type = "button";
          button.setAttribute("aria-label", "Toggle theme");
          button.textContent = "Dark mode";
          button.addEventListener("click", () => {
            const next =
              root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(next);
            button.textContent = next === "dark" ? "Light mode" : "Dark mode";
          });

          document.body.appendChild(button);
          return true;
        }

        const initialTheme = getInitialTheme();
        applyTheme(initialTheme);

        addToggle();
      })();
    </script>
  </body>
</html>

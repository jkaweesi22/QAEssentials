<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  {% assign gh_base = site.github.baseurl | default: site.baseurl %}
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cpath%20fill='%233b82f6'%20d='M32%204l20%2010v18c0%2016-10%2030-20%2032C22%2062%2012%2048%2012%2032V14L32%204z'/%3E%3Cpath%20fill='none'%20stroke='%23ffffff'%20stroke-width='6'%20stroke-linecap='round'%20stroke-linejoin='round'%20d='M20%2033l8%208%2016-20'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ gh_base }}/assets/css/style.css">
</head>
<body>
  {% include header.html %}
  <main class="page-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ gh_base }}/assets/js/theme.js"></script>
</body>
</html>

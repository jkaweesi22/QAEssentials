<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title | default: site.title }}</title>
  {% assign gh_base = site.github.baseurl | default: site.baseurl %}
  <link rel="stylesheet" href="{{ gh_base }}/assets/css/style.css">
</head>
<body>
  {% include header.html %}
  <main class="page-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ gh_base }}/assets/js/theme.js"></script>
</body>
</html>
